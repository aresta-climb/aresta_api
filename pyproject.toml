[project]
name = "aresta-api"
dynamic = ["version"]
description = "Contratos canônicos (Protobuf, SQL e OpenAPI 3.1) e geradores multi-linguagem do ecossistema Aresta"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "grpcio-tools>=1.50.0",
    "mypy-protobuf>=3.6.0",
    "openapi-spec-validator>=0.7.1",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.0",
    "types-protobuf>=5.0.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
python_files = ["*_test.py"]
testpaths = ["."]

[tool.mypy]
python_version = "3.13"
mypy_path = ["."]
explicit_package_bases = true
strict = true
follow_imports = "silent"
exclude = ["^proto[\\\\/]generated[\\\\/]"]

[[tool.mypy.overrides]]
module = [
    "aresta_api.*",
    "proto.generated.*",
    "aresta_api.proto.generated.*",
    "grpc_tools",
    "grpc_tools.*",
    "openapi_spec_validator",
    "openapi_spec_validator.*",
]
ignore_errors = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "proto/generated",
    "sql/generated",
    "openapi/generated",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF", "PT"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
