openapi: 3.1.0
info:
  title: API de Links Curtos (aresta.cc) e Vitrine Web SSR de Croquis (arestaclimb.com/croquis)
  version: 2.0.0
  description: |
    Serviço unificado de borda executado no Cloudflare Workers + Cloudflare D1 (`aresta-catalogo`)
    responsável pela verificação de domínios de deep links nativos (Android App Links e iOS Universal Links),
    redirecionamento permanente (`301`) de links curtos `https://aresta.cc` preservando CGI args/UTMs e
    renderização da vitrine pública indexável em `https://arestaclimb.com/croquis` (diretório por estado,
    Mapão nacional, JSON compacto de busca client-side, sitemap XML e teasers SSR com OpenGraph).
servers:
  - url: https://arestaclimb.com
    description: Domínio institucional e vitrine canônica indexável (`/croquis*`).
  - url: https://aresta.cc
    description: Encurtador canônico de placas físicas e compartilhamentos (`301` para `/croquis*`).
paths:
  /health:
    get:
      operationId: verificar_saude_app_links
      summary: Verifica a disponibilidade operacional do Worker de App Links e Vitrine.
      responses:
        "200":
          description: Worker operacional.
          content:
            text/plain:
              schema:
                type: string
  /.well-known/assetlinks.json:
    get:
      operationId: obter_assetlinks_android
      summary: Retorna o manifesto Digital Asset Links para validação automática de Android App Links.
      responses:
        "200":
          description: Lista de declarações Digital Asset Links para `app.escalada.croquis`.
          content:
            application/json:
              schema:
                type: string
  /.well-known/apple-app-site-association:
    get:
      operationId: obter_associacao_ios
      summary: Retorna o manifesto Apple App Site Association (AASA) para validação de iOS Universal Links.
      responses:
        "200":
          description: Manifesto AASA para `Z74K7R3WU7.app.escalada.croquis`.
          content:
            application/json:
              schema:
                type: string
  /robots.txt:
    get:
      operationId: obter_robots_txt
      summary: Retorna as diretivas de indexação para crawlers e bots com cache longo na borda.
      responses:
        "200":
          description: Conteúdo do arquivo robots.txt.
          content:
            text/plain:
              schema:
                type: string
  /favicon.ico:
    get:
      operationId: obter_favicon_ico
      summary: Redireciona permanentemente para o ícone oficial do Aresta com cache imutável na borda.
      responses:
        "301":
          description: Redirecionamento permanente para https://arestaclimb.com/favicon.svg.
  /favicon.svg:
    get:
      operationId: obter_favicon_svg
      summary: Redireciona permanentemente para o ícone vetorial oficial do Aresta com cache imutável na borda.
      responses:
        "301":
          description: Redirecionamento permanente para https://arestaclimb.com/favicon.svg.
  /og/{id_slug}.webp:
    get:
      operationId: obter_thumbnail_og
      summary: Proxy em borda para miniaturas OpenGraph `600x600` WebP com cache de 7 dias.
      parameters:
        - name: id_slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Imagem WebP da miniatura do croqui.
          content:
            image/webp:
              schema:
                type: string
        "404":
          description: Miniatura não encontrada.
  /croquis:
    get:
      operationId: listar_vitrine_croquis
      summary: Renderiza a página índice da vitrine com Mapão nacional, busca rápida e diretório por estado.
      responses:
        "200":
          description: Página HTML SSR do catálogo público de croquis.
          content:
            text/html:
              schema:
                type: string
  /croquis/busca.json:
    get:
      operationId: obter_indice_busca_vitrine
      summary: Retorna o índice JSON compacto de croquis, grupos, setores e escaladas para busca client-side.
      responses:
        "200":
          description: Lista JSON compacta de entidades pesquisáveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemBuscaVitrine"
  /croquis/sitemap.xml:
    get:
      operationId: obter_sitemap_vitrine
      summary: Retorna o sitemap XML completo de todas as URLs canônicas da vitrine `/croquis`.
      responses:
        "200":
          description: Documento XML do sitemap do catálogo.
          content:
            application/xml:
              schema:
                type: string
  /croquis/{uid}:
    get:
      operationId: redirecionar_vitrine_uid
      summary: Redireciona permanentemente (`301`) para a URL canônica `/croquis/{uid}/{slug}` preservando CGI args.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "301":
          description: Redirecionamento permanente para `/croquis/{uid}/{slug}`.
        "404":
          description: Entidade não encontrada no catálogo D1.
  /croquis/{uid}/{slug}:
    get:
      operationId: exibir_entidade_vitrine
      summary: Renderiza a página SSR de teaser de uma entidade (`croqui`, `grupo`, `setor` ou `escalada`) ou redireciona `301` se o slug divergir do canônico.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Página HTML SSR com teaser hierárquico, OpenGraph, Google Maps e CTAs do aplicativo.
          content:
            text/html:
              schema:
                type: string
        "301":
          description: Redirecionamento para o slug canônico atualizado.
        "404":
          description: UID inválido ou entidade inexistente no D1.
  /{uid}:
    get:
      operationId: resolver_link_uid
      summary: Redireciona permanentemente (`301`) links curtos `aresta.cc/{uid}` para `arestaclimb.com/croquis/{uid}/{slug}` preservando CGI args.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "301":
          description: Redirecionamento permanente para a vitrine canônica.
        "404":
          description: Entidade não encontrada no catálogo D1 ou formato de UID inválido.
  /{prefixo}/{uid}:
    get:
      operationId: resolver_link_prefixado_uid
      summary: Redireciona permanentemente (`301`) links prefixados `aresta.cc/{prefixo}/{uid}` convertendo prefixos em `?mapa=1` e UTMs.
      parameters:
        - name: prefixo
          in: path
          required: true
          schema:
            type: string
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "301":
          description: Redirecionamento permanente para a vitrine canônica preservando CGI args e UTMs.
        "404":
          description: Prefixo inválido, formato de UID inválido ou entidade não encontrada no catálogo D1.
components:
  schemas:
    SubentidadeVitrine:
      type: object
      description: Item filho pertencente a um croqui, grupo ou setor exibido na listagem de teaser.
      required:
        - uid
        - tipo
        - nome
      properties:
        uid:
          type: string
        tipo:
          type: string
          enum:
            - grupo
            - setor
            - escalada
        nome:
          type: string
        escalada_grau:
          type:
            - string
            - "null"
        escalada_tipo:
          type:
            - string
            - "null"
        setor_uid:
          type:
            - string
            - "null"
        setor_nome:
          type:
            - string
            - "null"
        grupo_uid:
          type:
            - string
            - "null"
        grupo_nome:
          type:
            - string
            - "null"
    ResumoEntidadeLink:
      type: object
      description: |
        Dados consolidados de uma entidade do catálogo (`croqui`, `grupo`, `setor` ou `escalada`)
        recuperados do Cloudflare D1 para redirecionamento canônico e renderização do teaser SSR.
      required:
        - uid
        - tipo
        - nome
        - croqui_uid
        - id_slug
        - croqui_nome
        - cidade
        - estado
        - escalada_grau
        - escalada_tipo
        - setor_nome
        - grupo_nome
      properties:
        uid:
          type: string
        tipo:
          type: string
          enum:
            - croqui
            - grupo
            - setor
            - escalada
        nome:
          type: string
        croqui_uid:
          type: string
        id_slug:
          type: string
        croqui_nome:
          type: string
        cidade:
          type:
            - string
            - "null"
        estado:
          type:
            - string
            - "null"
        escalada_grau:
          type:
            - string
            - "null"
        escalada_tipo:
          type:
            - string
            - "null"
        setor_uid:
          type:
            - string
            - "null"
        setor_nome:
          type:
            - string
            - "null"
        grupo_uid:
          type:
            - string
            - "null"
        grupo_nome:
          type:
            - string
            - "null"
        latitude_e7:
          type:
            - integer
            - "null"
        longitude_e7:
          type:
            - integer
            - "null"
        url_google_maps:
          type:
            - string
            - "null"
        subentidades:
          type: array
          items:
            $ref: "#/components/schemas/SubentidadeVitrine"
    ResumoCroquiVitrine:
      type: object
      description: Resumo agregado de um croqui para o diretório por estado e o Mapão nacional em `/croquis`.
      required:
        - croqui_uid
        - id_slug
        - nome
        - total_setores
        - total_escaladas
      properties:
        croqui_uid:
          type: string
        id_slug:
          type: string
        nome:
          type: string
        cidade:
          type:
            - string
            - "null"
        estado:
          type:
            - string
            - "null"
        latitude_e7:
          type:
            - integer
            - "null"
        longitude_e7:
          type:
            - integer
            - "null"
        url_google_maps:
          type:
            - string
            - "null"
        total_setores:
          type: integer
        total_escaladas:
          type: integer
    ItemBuscaVitrine:
      type: object
      description: Registro compacto serializado em `/croquis/busca.json` para busca client-side instantânea.
      required:
        - uid
        - tipo
        - nome
        - croqui_nome
        - slug
      properties:
        uid:
          type: string
        tipo:
          type: string
          enum:
            - croqui
            - grupo
            - setor
            - escalada
        nome:
          type: string
        grau:
          type:
            - string
            - "null"
        modalidade:
          type:
            - string
            - "null"
        croqui_nome:
          type: string
        localizacao:
          type:
            - string
            - "null"
        slug:
          type: string
    MetadadosRotaLink:
      type: object
      description: |
        Resultado da análise sintática de um link curto `aresta.cc` ou rota `/croquis/{uid}/{slug}`,
        incluindo flags de abertura em mapa e parâmetros analíticos de origem (`utm_source` e `utm_medium`).
      required:
        - uid
        - prefixo
        - abrir_mapa
        - origem_link
        - utm_source
        - utm_medium
      properties:
        uid:
          type: string
        prefixo:
          type:
            - string
            - "null"
        abrir_mapa:
          type: boolean
        origem_link:
          type:
            - string
            - "null"
          enum:
            - compartilhamento
            - qrcode
            - null
        utm_source:
          type:
            - string
            - "null"
        utm_medium:
          type:
            - string
            - "null"
