openapi: 3.1.0
info:
  title: API de Sincronização de Deltas do Catálogo Aresta
  version: 1.0.0
  description: |
    Serviço de borda executado no Cloudflare Workers + Cloudflare D1 (`https://catalogo.arestaclimb.com`)
    responsável pela sincronização incremental do catálogo SQLite (`catalogo.db`) nos dispositivos móveis.

    ### Propósito Arquitetural
    Em vez de obrigar o aplicativo móvel a baixar o arquivo `catalogo.db` inteiro a cada atualização de
    croqui, esta API recebe o hash da versão local instalada no dispositivo (`versao_local`) e o hash da
    versão mais recente publicada no `indice.binarypb` (`versao_destino`).

    O Worker consulta o histórico sequencial na tabela `deltas_catalogo` do Cloudflare D1 e aplica a
    condensação de deltas (**Delta Squash**), mesclando todas as inserções, atualizações (`upserts`) e
    remoções (`deletes`) intermediárias em um único pacote JSON determinístico, retido no cache da CDN
    da Cloudflare por 1 ano (`Cache-Control: public, max-age=31536000, s-maxage=31536000, immutable`).
    Caso a `versao_local` seja desconhecida ou posterior à `versao_destino`, instrui o cliente a realizar
    o download completo (`acao: "full_download"`).
servers:
  - url: https://catalogo.arestaclimb.com
    description: Gateway global de sincronização de deltas do catálogo na borda Cloudflare (Workers + D1).
paths:
  /health:
    get:
      operationId: verificar_saude_catalogo
      summary: Verifica a disponibilidade operacional do Worker de sincronização do catálogo.
      description: |
        Endpoint de monitoramento (healthcheck) que responde imediatamente na borda indicando que o
        roteador do Cloudflare Worker do catálogo está ativo.
      responses:
        "200":
          description: Worker do catálogo operacional.
          content:
            text/plain:
              schema:
                type: string
  /sync:
    get:
      operationId: sincronizar_catalogo
      summary: Obtém o delta condensado (Delta Squash) entre a versão local do cliente e a versão destino.
      description: |
        Calcula ou recupera do cache da CDN a transição exata necessária para atualizar o banco SQLite
        local do aplicativo da `versao_local` para a `versao_destino`.

        - Se `versao_local == versao_destino`, retorna `acao: "apply_delta"` com listas vazias.
        - Se ambas as versões existirem em `deltas_catalogo` com `id_local <= id_destino`, condensa todos
          os deltas do intervalo `(id_local, id_destino]` em um único conjunto de `upserts` e `deletes`
          (`acao: "apply_delta"`).
        - Se qualquer uma das versões não for encontrada no histórico do D1 ou `id_local > id_destino`,
          retorna `acao: "full_download"` para que o aplicativo baixe o `catalogo.db` completo do R2.
      parameters:
        - name: versao_local
          in: query
          required: true
          description: Hash SHA-256 curto (16 caracteres hexadecimais) da `versao_catalogo` atualmente armazenada no `catalogo_meta` do dispositivo.
          schema:
            type: string
        - name: versao_destino
          in: query
          required: true
          description: Hash SHA-256 curto (16 caracteres hexadecimais) da versão alvo anunciada pelo `indice.binarypb` mais recente.
          schema:
            type: string
      responses:
        "200":
          description: Resultado da sincronização incremental (`apply_delta`) ou instrução de fallback (`full_download`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaSyncCatalogo"
        "400":
          description: Parâmetros obrigatórios `versao_local` ou `versao_destino` ausentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroCatalogo"
        "500":
          description: Falha interna ao consultar o banco Cloudflare D1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroCatalogo"
components:
  schemas:
    CatalogoCroqui:
      type: object
      description: |
        Representação JSON de uma linha da tabela `catalogo_croquis` (paridade 1:1 com `sql/catalogo.sql`).
        Contém os metadados geográficos e de identificação de um croqui/pico.
      required:
        - croqui_uid
        - id_slug
        - nome
        - cidade
        - estado
      properties:
        croqui_uid:
          type: string
          description: Identificador único imutável (UUIDv4 de 36 caracteres) do croqui.
        id_slug:
          type: string
          description: Identificador textual legível e pasta do croqui (ex. `br_mg_igarape_pedra_grande`).
        nome:
          type: string
          description: Nome de exibição do croqui ou pico (ex. `Pedra Grande de Igarapé`).
        cidade:
          type:
            - string
            - "null"
          description: Município onde o pico está localizado (ex. `Igarapé`) ou `null`.
        estado:
          type:
            - string
            - "null"
          description: Sigla da unidade federativa / estado em 2 letras maiúsculas (ex. `MG`, `RJ`, `SP`) ou `null`.
        atualizado_em:
          type: integer
          description: Timestamp Unix Epoch em segundos da última compilação do croqui (padrão `0` quando omitido no delta).
    CatalogoEntidade:
      type: object
      description: |
        Representação JSON de uma linha da tabela `catalogo_aresta` (paridade 1:1 com `sql/catalogo.sql`).
        Descreve qualquer entidade endereçável por UID dentro de um croqui (`escalada`, `setor`, `grupo` ou `botao`).
      required:
        - uid
        - tipo
        - croqui_uid
        - nome
        - escalada_grau
        - escalada_tipo
        - setor_uid
        - grupo_uid
      properties:
        uid:
          type: string
          description: Identificador único universal e imutável (UUIDv4) da entidade.
        tipo:
          type: string
          description: Categoria da entidade (`escalada`, `setor`, `grupo` ou `botao`).
        croqui_uid:
          type: string
          description: UID do croqui ao qual esta entidade pertence.
        nome:
          type: string
          description: Nome da via/boulder, setor, grupo ou texto do botão.
        escalada_grau:
          type:
            - string
            - "null"
          description: Graduação formatada da escalada (ex. `6sup`, `V4`, `45m`) quando `tipo == "escalada"`, ou `null`.
        escalada_tipo:
          type:
            - string
            - "null"
          description: Modalidade da escalada (`esportiva`, `tradicional`, `boulder`, `multienfiada`, `highline`) ou `null`.
        setor_uid:
          type:
            - string
            - "null"
          description: UID do setor pai imediato (aplicável quando `tipo == "escalada"`), ou `null`.
        grupo_uid:
          type:
            - string
            - "null"
          description: UID do grupo de setores pai (aplicável a setores e escaladas dentro de um grupo), ou `null`.
    UpsertsSyncCatalogo:
      type: object
      description: Lote de registros inseridos ou atualizados que devem ser aplicados via `INSERT OR REPLACE` no SQLite local.
      required:
        - croquis
        - entidades
      properties:
        croquis:
          type: array
          description: Lista de croquis novos ou modificados para `INSERT OR REPLACE INTO catalogo_croquis`.
          items:
            $ref: "#/components/schemas/CatalogoCroqui"
        entidades:
          type: array
          description: Lista de entidades novas ou modificadas para `INSERT OR REPLACE INTO catalogo_aresta`.
          items:
            $ref: "#/components/schemas/CatalogoEntidade"
    DeletesSyncCatalogo:
      type: object
      description: Lote de identificadores únicos (`croqui_uid` e `uid`) que foram excluídos e devem ser removidos via `DELETE` no SQLite local.
      required:
        - croquis
        - entidades
      properties:
        croquis:
          type: array
          description: Lista de `croqui_uid` a remover da tabela `catalogo_croquis`.
          items:
            type: string
        entidades:
          type: array
          description: Lista de `uid` a remover da tabela `catalogo_aresta`.
          items:
            type: string
    RespostaSyncCatalogo:
      type: object
      description: Envelope de resposta do endpoint `GET /sync` instruindo o cliente sobre como sincronizar seu catálogo SQLite.
      required:
        - acao
      properties:
        acao:
          type: string
          description: |
            Ação que o cliente deve executar:
            - `apply_delta`: Aplicar transacionalmente os lotes `deletes` e `upserts` no banco local e atualizar `versao_catalogo`.
            - `full_download`: Baixar o arquivo `catalogo.db` completo do bucket R2 por impossibilidade de reconciliação incremental.
          enum:
            - apply_delta
            - full_download
        versao_atual:
          type: string
          description: Hash da versão destino efetiva após a sincronização.
        total_deltas:
          type: integer
          description: Quantidade de versões intermediárias que foram condensadas neste pacote de sincronização.
        versao_local:
          type: string
          description: Hash da versão local informada na requisição (quando aplicável).
        versao_destino:
          type: string
          description: Hash da versão destino informada na requisição (quando aplicável).
        upserts:
          $ref: "#/components/schemas/UpsertsSyncCatalogo"
        deletes:
          $ref: "#/components/schemas/DeletesSyncCatalogo"
        motivo:
          type: string
          description: Explicação opcional quando `acao == "full_download"`.
    ErroCatalogo:
      type: object
      description: Resposta padrão de erro retornada pelo Worker do catálogo em caso de parâmetros ausentes (HTTP 400) ou falha no D1 (HTTP 500).
      required:
        - erro
      properties:
        erro:
          type: string
          description: Mensagem descritiva do erro ocorrido.
