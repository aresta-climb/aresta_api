openapi: 3.1.0
info:
  title: API de Colaboração e Submissão de Croquis Aresta
  version: 1.0.0
  description: |
    Conjunto de Supabase Edge Functions (`https://yzkhiaoqtxvvcyyuwmqg.supabase.co`) responsáveis pelo
    fluxo de contribuição colaborativa e envio de edições de croquis a partir do **Aresta Editor Desktop**
    para o repositório comunitário `aresta-climb/aresta_db` no GitHub, sem exigir que o escalador colaborador
    possua conta técnica no GitHub ou chaves SSH configuradas.

    ### Propósito Arquitetural
    O fluxo de submissão é dividido em duas etapas seguras autenticadas via JWT do Supabase:
    1. **Git Smart HTTP Proxy (`/functions/v1/git-proxy`)**:
       Intercepta os comandos `git push` executados pelo Aresta Editor Desktop, analisa o protocolo binário
       `pkt-line` (`git-receive-pack`) em memória e garante que:
       - A branch de destino siga estritamente o prefixo `sugestao/` (rejeitando qualquer tentativa de push
         em `main` ou outras branches protegidas).
       - Uma branch nova seja registrada na tabela `suggestion_branches` vinculada ao e-mail e ID do autor.
       - Atualizações subsequentes na mesma branch só sejam permitidas se enviadas pelo mesmo autor original.
       - O tráfego autorizado seja repassado ao GitHub usando as credenciais de instalação do **Aresta Climb Bot**.
    2. **Abertura/Atualização de Pull Request (`/functions/v1/create-pr`)**:
       Após o push bem-sucedido da branch, inspeciona via API do GitHub todos os arquivos modificados em
       relação à `main`, verifica que 100% dos arquivos estão contidos dentro do diretório `database/`
       (excluindo imediatamente a branch remota em caso de violação de escopo) e abre ou reutiliza a
       Pull Request correspondente no repositório `aresta-climb/aresta_db`.
servers:
  - url: https://yzkhiaoqtxvvcyyuwmqg.supabase.co
    description: Gateway das Supabase Edge Functions do ecossistema Aresta.
paths:
  /functions/v1/create-pr:
    post:
      operationId: criar_pull_request
      summary: Valida o escopo da branch de edição e abre ou atualiza uma Pull Request no repositório aresta_db.
      description: |
        Requer cabeçalho `Authorization: Bearer <supabase_jwt>`.
        Inspeciona os arquivos alterados na `branch` informada para garantir que apenas arquivos sob
        `database/` foram modificados. Se já existir uma Pull Request aberta para esta branch registrada
        em `suggestion_branches`, retorna os dados existentes (`atualizado: true`); caso contrário, cria
        uma nova Pull Request atribuindo coautoria ao usuário autenticado (ou usando `token_usuario_github`
        quando o usuário vinculou sua conta GitHub via OAuth).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequisicaoCriarPullRequest"
      responses:
        "200":
          description: Pull Request criada ou localizada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaCriarPullRequest"
        "400":
          description: Parâmetros ausentes, nome de branch inválido ou violação de escopo de arquivos fora de `database/`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroColaboracao"
        "401":
          description: Token JWT do Supabase ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroColaboracao"
        "500":
          description: Erro interno ao comunicar com a API do GitHub ou banco de controle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroColaboracao"
  /functions/v1/git-proxy:
    post:
      operationId: git_proxy_base
      summary: URL base configurada como remote HTTP no cliente Git do Aresta Editor Desktop.
      description: |
        Representa o prefixo base do repositório remoto usado pelo cliente Git (`{URL}/functions/v1/git-proxy`),
        a partir do qual o protocolo Git Smart HTTP deriva as chamadas para `/info/refs` e `/git-receive-pack`.
      responses:
        "200":
          description: Operação Git concluída.
  /functions/v1/git-proxy/info/refs:
    get:
      operationId: git_proxy_info_refs
      summary: Descoberta de referências Git (handshake inicial do git push via git-receive-pack).
      description: |
        Autentica o colaborador via cabeçalho `Authorization` (Basic ou Bearer contendo o JWT do Supabase)
        e repassa a consulta `GET /info/refs?service=git-receive-pack` ao repositório `aresta-climb/aresta_db.git`
        autenticado com o token do Aresta Climb Bot.
      parameters:
        - name: service
          in: query
          required: true
          description: Nome do serviço Git Smart HTTP solicitado pelo cliente (ex. `git-receive-pack`).
          schema:
            type: string
      responses:
        "200":
          description: Anúncio de referências (`application/x-git-receive-pack-advertisement`) retornado pelo GitHub.
        "401":
          description: Credenciais ausentes ou token JWT inválido.
  /functions/v1/git-proxy/git-receive-pack:
    post:
      operationId: git_proxy_receive_pack
      summary: Recebimento, validação de segurança pkt-line e encaminhamento de objetos Git.
      description: |
        Decodifica o cabeçalho `pkt-line` do pacote Git enviado pelo Editor Desktop, valida que todas as
        referências modificadas pertencem ao namespace `refs/heads/sugestao/*`, verifica a titularidade
        da branch na tabela `suggestion_branches` (retornando HTTP 409 se uma branch nova já existir ou
        HTTP 403 se pertencer a outro autor) e transmite o packfile ao GitHub.
      responses:
        "200":
          description: Objetos Git recebidos e aplicados na branch remota (`application/x-git-receive-pack-result`).
        "400":
          description: Nenhum comando Git válido detectado no corpo da requisição.
        "401":
          description: Token JWT ausente ou inválido.
        "403":
          description: Tentativa de escrita fora de `refs/heads/sugestao/*` ou em branch pertencente a outro autor.
        "409":
          description: Conflito na criação de branch (`a branch de sugestão já existe`).
components:
  schemas:
    RequisicaoCriarPullRequest:
      type: object
      description: Corpo JSON enviado pelo Aresta Editor Desktop ao endpoint `POST /functions/v1/create-pr`.
      required:
        - branch
        - title
        - description
      properties:
        branch:
          type: string
          description: Nome da branch de sugestão enviada via `git-proxy` (ex. `sugestao/br_mg_igarape_pedra_grande-20261017`).
        title:
          type: string
          description: Título descritivo da Pull Request a ser aberta no GitHub.
        description:
          type: string
          description: Corpo em Markdown detalhando as alterações realizadas pelo colaborador no croqui.
        token_usuario_github:
          type: string
          description: Token OAuth opcional da conta GitHub do próprio usuário para abrir a PR diretamente em nome dele.
        github_user_token:
          type: string
          description: Alias legado opcional para `token_usuario_github` mantido por compatibilidade.
    RespostaCriarPullRequest:
      type: object
      description: Dados da Pull Request criada ou atualizada no repositório `aresta-climb/aresta_db`.
      required:
        - numero_pr
        - url_pr
        - pr_number
        - pr_url
      properties:
        numero_pr:
          type: integer
          description: Número sequencial da Pull Request no GitHub (ex. `142`).
        url_pr:
          type: string
          description: URL pública HTML da Pull Request no GitHub (ex. `https://github.com/aresta-climb/aresta_db/pull/142`).
        pr_number:
          type: integer
          description: Espelho de `numero_pr` mantido para compatibilidade com versões anteriores do cliente.
        pr_url:
          type: string
          description: Espelho de `url_pr` mantido para compatibilidade com versões anteriores do cliente.
        atualizado:
          type: boolean
          description: Indica `true` quando uma Pull Request já existente para a branch foi reaproveitada.
    ErroColaboracao:
      type: object
      description: Estrutura de erro retornada pelo `create-pr` em caso de falha de validação, autenticação ou escopo.
      required:
        - erro
      properties:
        erro:
          type: string
          description: Mensagem explicativa do erro ocorrido.
        arquivos_invalidos:
          type: array
          description: Lista de caminhos de arquivos fora do diretório permitido `database/` que motivaram a rejeição e exclusão da branch.
          items:
            type: string
