name: Gerar Contratos e Bindings (Protobuf, SQL, OpenAPI)

on:
  push:
    branches:
      - main
    paths:
      - 'proto/*.proto'
      - 'sql/*.sql'
      - 'openapi/*.yaml'
      - 'src/**'
      - 'build.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/generate_protobuf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv e Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Dart Protoc Plugin
        run: dart pub global activate protoc_plugin

      - name: Add Dart Pub Cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Run build.py
        run: uv run python build.py -f

      - name: Run validation and parity tests
        run: uv run pytest

      - name: Commit and Push changes
        run: |
          # Configura o usuário padrão do git para a action
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Adiciona eventuais arquivos gerados/modificados
          git add proto/generated/ sql/generated/ openapi/generated/

          # Verifica se algum arquivo de fato mudou em relação ao commit anterior
          if git diff --staged --quiet; then
            echo "Nenhuma mudança na geração em relação à atual. O repositório já está sincronizado!"
          else
            git commit -m "chore(contratos): gerar bindings automaticamente (proto, sql, openapi) [skip ci]"
            git push
            echo "Arquivos de contratos gerados automaticamente foram commitados e enviados para a branch!"
          fi
